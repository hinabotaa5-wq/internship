<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
      {% block title %}{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- 共通テーマ -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  </head>

  <body>

    <header style="
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background-color: #ffffff;
      border-bottom: 1px solid #c7d4e6;
    ">
      <a href="https://csoption.nifty.com/myapp/" style="justify-self: start; display: flex; align-items: center;">
        <img
          src="{{ url_for('static', filename='images/nifty-logo.png') }}"
          alt="@nifty"
          style="height: 28px; width: auto;"
        >
      </a>

      <a href="{{ url_for('app.wifi.top') }}" style="
        justify-self: center;
        font-weight: 700;
        font-size: 20px;
        color: #1a2740;
        text-decoration: none;
      ">
        Heat Mafty
      </a>

      <div></div>
    </header>

    <div class="container mt-4 mb-4">
      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>

</html>
