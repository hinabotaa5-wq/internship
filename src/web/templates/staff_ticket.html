{% extends 'layout.html' %}

{% block title %}
  コールセンター向け問い合わせ照会
{% endblock %}

{% block content %}
  <link rel="stylesheet" href="{{ url_for('static', filename='wifi/heatmap.css') }}">

  <h1 class="mb-4">問い合わせ照会（コールセンター用）</h1>
  <p class="text-muted">
    お客様から伺った受付番号を入力してください。間取り・Q&amp;A回答履歴を表示します。<br>
    ※ 表示値は間取りや設定から計算したシミュレーションによる目安です。実際の通信品質を保証するものではありません。
  </p>

  <div class="card mb-4">
    <div class="card-body">
      <div class="mb-3">
        <label for="ticket-number-input" class="form-label">受付番号</label>
        <input type="text" id="ticket-number-input" class="form-control" placeholder="NIF-XXXXXX">
      </div>
      <button id="fetch-btn" type="button" class="btn btn-primary">照会する</button>

      <div id="fetch-result" class="mt-4"></div>
    </div>
  </div>

  <script type="module">
    import { renderStaffHeatmap, LEVEL_TEXT } from "{{ url_for('static', filename='wifi/staff_heatmap.js') }}";

    const GET_URL_BASE = "{{ url_for('app.tickets.get_ticket', ticket_number='__TICKET_NUMBER__') }}";

    function renderHeatmap(container, roomLayout) {
      const heading = document.createElement("h5");
      heading.className = "mt-4";
      heading.textContent = "電波の届きぐあい（間取りからのシミュレーション）";
      container.appendChild(heading);

      if (!roomLayout || !roomLayout.rooms || !roomLayout.rooms.length) {
        const note = document.createElement("p");
        note.className = "text-muted";
        note.textContent = "間取りデータがないため表示できません。";
        container.appendChild(note);
        return;
      }

      const wrap = document.createElement("div");
      wrap.className = "hm-page";
      const canvas = document.createElement("canvas");
      canvas.className = "hm-canvas";
      wrap.appendChild(canvas);
      container.appendChild(wrap);

      let simulation;
      let suggestion;
      try {
        ({ simulation, suggestion } = renderStaffHeatmap(canvas, roomLayout));
      } catch (error) {
        const note = document.createElement("p");
        note.className = "text-muted";
        note.textContent = "間取りデータの形式が不正なため表示できません。";
        wrap.replaceWith(note);
        return;
      }

      const summaryList = document.createElement("ul");
      summaryList.className = "hm-rooms mt-3";
      summaryList.innerHTML = simulation.room_summaries
        .map((summary) => {
          const room = roomLayout.rooms.find((r) => r.id === summary.room_id);
          const name = room ? room.name : summary.room_id;
          return `<li><span class="hm-room-name">${name}</span><span class="hm-room-level" data-level="${summary.level}">${LEVEL_TEXT[summary.level]}</span></li>`;
        })
        .join("");
      container.appendChild(summaryList);

      const suggestionEl = document.createElement("p");
      suggestionEl.className = "hm-suggestion-message";
      suggestionEl.textContent = suggestion.message;
      container.appendChild(suggestionEl);
    }

    function renderTicket(container, data) {
      container.replaceChildren();

      const summary = document.createElement("dl");
      summary.className = "row";
      summary.innerHTML = `
        <dt class="col-sm-2">受付番号</dt>
        <dd class="col-sm-10">${data.ticket_number}</dd>
        <dt class="col-sm-2">受付日時</dt>
        <dd class="col-sm-10">${data.created_at}</dd>
      `;
      container.appendChild(summary);

      renderHeatmap(container, data.room_layout);

      const qaHeading = document.createElement("h5");
      qaHeading.className = "mt-4";
      qaHeading.textContent = "Q&A回答履歴（qa_history）";
      container.appendChild(qaHeading);

      const qaPre = document.createElement("pre");
      qaPre.className = "bg-light p-3 rounded";
      qaPre.textContent = JSON.stringify(data.qa_history, null, 2);
      container.appendChild(qaPre);

      const diagnosisHeading = document.createElement("h5");
      diagnosisHeading.className = "mt-4";
      diagnosisHeading.textContent = "診断結果（diagnosis_result）";
      container.appendChild(diagnosisHeading);

      if (data.diagnosis_result) {
        const diagnosisPre = document.createElement("pre");
        diagnosisPre.className = "bg-light p-3 rounded";
        diagnosisPre.textContent = JSON.stringify(data.diagnosis_result, null, 2);
        container.appendChild(diagnosisPre);
      } else {
        const noDiagnosis = document.createElement("p");
        noDiagnosis.className = "text-muted";
        noDiagnosis.textContent = "診断を経ていない問い合わせです。";
        container.appendChild(noDiagnosis);
      }
    }

    function renderError(container, message) {
      const div = document.createElement("div");
      div.className = "alert alert-danger mb-0";
      div.textContent = message;
      container.replaceChildren(div);
    }

    document.getElementById("fetch-btn").addEventListener("click", async () => {
      const resultEl = document.getElementById("fetch-result");
      const ticketNumber = document.getElementById("ticket-number-input").value.trim();
      if (!ticketNumber) {
        renderError(resultEl, "受付番号を入力してください");
        return;
      }

      const url = GET_URL_BASE.replace("__TICKET_NUMBER__", encodeURIComponent(ticketNumber));
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) {
          renderError(resultEl, data.description || "取得に失敗しました");
          return;
        }
        renderTicket(resultEl, data);
      } catch (err) {
        renderError(resultEl, "通信エラーが発生しました");
      }
    });

    document.getElementById("ticket-number-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        document.getElementById("fetch-btn").click();
      }
    });
  </script>
{% endblock %}
