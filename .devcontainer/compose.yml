version: "3"
name: internship-2025-5days_devcontainer

services:
  web:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - type: bind
        source: ..
        target: /app
    ports:
      - "18347:5000"
    environment:
      # ホットリロード(ファイル変更時のプロセス再起動)でログインセッションが切れないよう固定
      - SECRET_KEY=devcontainer-fixed-secret-key-not-for-production

networks:
  intern-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.11.0/24
